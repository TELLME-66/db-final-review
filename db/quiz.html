<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>刷题 · 数据库系统概论 · 备考</title>
<meta name="description" content="数据库系统概论期末题库：239 道单选、多选、判断、填空、简答题，按章筛选、即时判分、自动错题本与练习统计。">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/theme.css?v=2">
<link rel="stylesheet" href="../assets/site.css?v=2">
<link rel="stylesheet" href="../assets/course.css?v=2">
<link rel="stylesheet" href="../assets/quiz.css?v=2">
<script>(function(){var d=document.documentElement;d.classList.add('js');try{var t=localStorage.getItem('site-theme');if(t==='light'||t==='dark')d.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
<a class="skip" href="#main">跳到正文</a>

<header class="topbar" id="topbar">
  <div class="wrap-wide bar">
    <a class="brand" href="../index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="2.6"/><path d="M5 6v6c0 1.44 3.13 2.6 7 2.6s7-1.16 7-2.6V6"/><path d="M5 12v6c0 1.44 3.13 2.6 7 2.6s7-1.16 7-2.6v-6"/></svg>
      <span>数据库系统概论</span>
    </a>
    <nav class="nav" aria-label="站点导航">
      <a href="../index.html">首页</a>
      <a href="../db.html">讲义</a>
      <a href="quiz.html" aria-current="page">题库</a>
      <a href="exam.html">模拟卷</a>
      <a href="cheatsheet.html">速查卡</a>
    </nav>
    <button class="icon-btn" id="themeBtn" type="button" title="主题：跟随系统（点击切换）" aria-label="主题：跟随系统（点击切换）"><span id="themeIcon" aria-hidden="true">◐</span></button>
  </div>
</header>

<main id="main">
  <div class="page-head wrap">
    <p class="kicker" style="margin-bottom:14px">练习</p>
    <h1>刷题</h1>
    <p class="sub">239 道题，按章、按题型任意组合。答错自动进错题本，进度存在本机浏览器里。</p>
  </div>

  <div class="wrap qz">
    <div class="toolbar">
      <label class="tb-lab">范围
        <select class="tb" id="chSel" aria-label="选择章节"></select>
      </label>
      <label class="tb-lab">题型
        <select class="tb" id="typeSel" aria-label="选择题型">
          <option value="">全部题型</option>
          <option value="single">单项选择</option>
          <option value="multi">多项选择</option>
          <option value="judge">判断</option>
          <option value="fill">填空</option>
          <option value="short">简答</option>
        </select>
      </label>
      <span class="sp"></span>
      <button class="chip" type="button" data-mode="seq" aria-pressed="true">顺序</button>
      <button class="chip" type="button" data-mode="random" aria-pressed="false">随机</button>
      <button class="chip" type="button" data-mode="wrong" aria-pressed="false">只做错题</button>
      <button class="chip" type="button" data-mode="undone" aria-pressed="false">没做过</button>
    </div>

    <div class="pbar2"><i id="qzBar"></i></div>

    <div class="stats" id="qzStats"></div>

    <div class="card" id="qzCard" aria-live="polite"></div>

    <p style="font-size:12px;color:var(--muted);margin:16px 2px 0;line-height:1.8">
      快捷键：<span class="kbd">1–6</span> 选项 · <span class="kbd">Enter</span> 提交 / 下一题 · <span class="kbd">←</span> <span class="kbd">→</span> 翻题
      　·　<a href="#" id="clearBtn">清空本机练习记录</a>
    </p>

    <section style="margin-top:56px">
      <h2 style="font-size:clamp(20px,2.4vw,26px);letter-spacing:-.025em;margin:0 0 6px">各章练习进度</h2>
      <p style="font-size:13px;color:var(--muted);margin:0 0 10px">点章节名直接切到该章；百分比是该章已做题目的正确率。</p>
      <div class="chprog" id="chProg"></div>
    </section>
  </div>
</main>

<footer class="footer">
  <div class="wrap foot-inner" style="padding:28px 0 30px">
    <div class="foot-legal" style="padding-top:0">
      <span>数据库系统概论（第 6 版）· 题库与解析据本学期课件整理</span>
      <span><a href="../db.html">回讲义</a> · <a href="exam.html">做模拟卷</a> · <a href="../index.html">首页</a></span>
    </div>
  </div>
</footer>
<button class="backtop" id="backtop" type="button" aria-label="回到顶部" hidden>↑</button>

<script src="../assets/site.js?v=2"></script>
<script src="../assets/data/quiz.js?v=2"></script>
<script src="../assets/quiz.js?v=2"></script>
<script>
(function(){
  var b = document.getElementById('clearBtn');
  if (!b) return;
  b.addEventListener('click', function (e) {
    e.preventDefault();
    if (!confirm('清空全部做题记录与错题本？此操作不可撤销。')) return;
    try { localStorage.removeItem('db-quiz'); } catch (err) {}
    location.reload();
  });
})();
</script>
</body>
</html>
